[project]
name = "certbot-dns-muumuu"
version = "0.1.0"
description = "Muumuu Domain DNS Authenticator plugin for Certbot"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Kenichi Takahashi" }]
requires-python = ">=3.10"
dependencies = [
    "certbot>=4.0.0",
    "requests>=2.25.0",
]
keywords = ["certbot", "letsencrypt", "acme", "dns-01", "muumuu-domain"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Plugins",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Security",
    "Topic :: System :: Installation/Setup",
    "Topic :: System :: Networking",
    "Topic :: System :: Systems Administration",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/kenchan/certbot-dns-muumuu"
Issues = "https://github.com/kenchan/certbot-dns-muumuu/issues"

[project.entry-points."certbot.plugins"]
dns-muumuu = "certbot_dns_muumuu._internal.dns_muumuu:Authenticator"

[dependency-groups]
dev = [
    "mypy>=1.10",
    "pytest>=8.0",
    "responses>=0.25",
    "ruff>=0.6",
    "types-requests",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["configobj"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
